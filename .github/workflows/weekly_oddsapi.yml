name: FanDuel Pull (The Odds API)

# The Odds API's free plan is 500 credits/month, so this is deliberately NOT
# tied to the every-20-minutes odds refresh.
#
#   Thursday   -> moneylines + player props  (~1 + 4 credits per game, roughly 55-60 total)
#   other days -> moneylines only            (1 credit)
#
# Monthly total is roughly 250-300 credits, leaving headroom for manual runs.
# Props are pulled Thursday because sportsbooks generally have Sunday's player
# props up by then; check the first run's log ("FanDuel props diagnostics") and
# move the day if lines are missing.
#
# Requires a repository secret named ODDS_API_KEY
# (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "0 14 * * 4"            # Thursday 14:00 UTC (10:00 ET): full pull
    - cron: "0 14 * * 0,1,2,3,5,6"  # every other day: moneylines only
  workflow_dispatch: {}              # manual run from the Actions tab = full pull

concurrency:
  group: nfl-site-repo-write         # same group as build.yml / refresh_odds.yml
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull-fanduel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull FanDuel lines and rebuild
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$CRON" = "0 14 * * 4" ]; then
            python scripts/build.py --pull-oddsapi
          else
            python scripts/build.py --no-fetch --pull-oddsapi-moneylines
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "FanDuel pull: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done
