name: Rebuild NFL Prop Edge Board

on:
  schedule:
    # 09:00 UTC every Tuesday through Sunday -- adjust to your needs.
    # NFL plays weekly, so a daily cron is mostly wasted runs; this hits
    # the morning after Sun/Mon/Thu games and skips the dead Monday AM slot.
    - cron: "0 9 * * 2,3,4,5,6,0"
  workflow_dispatch: {}   # lets you trigger a manual rebuild from the Actions tab

concurrency:
  group: nfl-site-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site (fetches live nflreadpy data)
        run: python scripts/build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Auto-rebuild: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase onto whatever's already on origin/main before pushing --
          # without this, if refresh_odds.yml (runs every 20 min) or another
          # instance of this same workflow pushed in the time it took this
          # run to build, a plain `git push` fails outright (non-fast-
          # forward) and this entire run's update is silently lost. Retried
          # a few times since a rebase can itself lose a very tight race.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done
