{% extends "base.html" %}
{% import "_macros.html" as macros %}
{% block title %}Receptions — Prop Edge Board{% endblock %}
{% block content %}
{% include "receptions_body.html" %}
<script>
(function() {
  var tabs = document.querySelectorAll('.game-picker > .game-tab[data-game-idx]');
  var panels = document.querySelectorAll('.game-panel[data-game-panel]');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var idx = tab.getAttribute('data-game-idx');
      tabs.forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      panels.forEach(function(p) {
        p.classList.toggle('hidden', p.getAttribute('data-game-panel') !== idx);
      });
    });
  });
})();
</script>
{% endblock %}
